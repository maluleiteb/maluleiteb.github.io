<style>
body{margin:0;background:#141414;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}

<body>
<div id="app"><img src="assets/logo-las-vagas.png" alt="Las Vagas Estacionamento"><span>VERSÃO DE TESTE</span></div>
<script>
window.LV_LOGO = 'assets/logo-las-vagas.png';
window.sb = supabase.createClient('https://gzbnjldzfmruwgbydcis.supabase.co', 'sb_publishable_bBQvbHJlDQ_PauuZeOTwKg_e8gLetuV');
window.sb.schema('acesso').rpc('app_teste').then(function (r) {

});
